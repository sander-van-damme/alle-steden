name: Browserchecks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    # Playwright 1.56.1 supports 24.04, not the 26.04 ubuntu-latest runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - run: node tests/city-map-browser.mjs
      - run: node tests/calendar-browser.mjs
      - run: node tests/route-view-browser.mjs
      - run: node tests/surface-browser.mjs
      - run: node tests/planner-ui-browser.mjs
      - run: node tests/planner-options-browser.mjs
      - run: node tests/planner-map-stops-browser.mjs
      - run: node tests/link-check-browser.mjs
      - run: node tests/planner-browser.mjs
      - run: node tests/exterior-browser.mjs
      - run: node tests/route-rail-browser.mjs
      - run: node tests/visits-browser.mjs
      - run: node tests/day-home-browser.mjs
