name: GitHub Pages preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-build.yml
      - tests/pages-browser.mjs

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:pages
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/pages-browser.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require the separate github.io project address
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" -o "$RUNNER_TEMP/pages-site.json"; then
            echo "::error::Cannot verify the GitHub Pages settings. Enable the GitHub Actions source before retrying."
            exit 1
          fi
          if ! jq -e '(.cname // "") == "" and .build_type == "workflow" and (.html_url | sub("/$"; "")) == "https://sander-van-damme.github.io/alle-steden"' \
            "$RUNNER_TEMP/pages-site.json" >/dev/null; then
            echo "::error::The GitHub Pages site is not configured as a standalone github.io preview. No deployment was made."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
