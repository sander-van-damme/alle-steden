name: GitHub Pages preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-build.yml
      - tests/pages-browser.mjs

permissions:
  contents: read

concurrency:
  group: github-pages-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:pages
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/pages-browser.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
          retention-days: 3

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
