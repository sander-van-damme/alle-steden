name: GitHub Pages build (no deploy)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check static artifact at the URL root
        run: |
          python3 -m http.server 4181 --bind 127.0.0.1 --directory dist > /tmp/pages-preview.log 2>&1 &
          server="$!"
          trap 'kill "$server"' EXIT
          origin=http://127.0.0.1:4181
          curl -fsS --retry 5 --retry-connrefused "$origin/" -o /tmp/pages-home.html
          grep -Fq 'Steden van België' /tmp/pages-home.html
          css=$(grep -oE '/assets/v-[a-f0-9]+/site\.css' /tmp/pages-home.html)
          test -n "$css"
          for path in "$css" /kalender/ /planner/ /steden/gent/ /privacy/ /404.html /calendar-data.json /planner-data.json /data/gent.ttl; do
            curl -fsS "$origin$path" -o /dev/null
          done
          test ! -e dist/functions
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$origin/api/city-live?city=gent&source=flanders")" = 404
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 3
